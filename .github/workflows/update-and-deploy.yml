name: Update flights and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"
      timezone: "Europe/Moscow"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: flight-data-update
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Update flight data
        run: python scripts/update_flights.py --data site/data/flights.json

      - name: Commit changed data
        shell: bash
        run: |
          if git diff --quiet -- site/data/flights.json; then
            echo "Flight data did not change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/flights.json
          git commit -m "data: update flight status"
          git push

  deploy-pages:
    runs-on: ubuntu-latest
    needs: update-data
    timeout-minutes: 10
    concurrency:
      group: github-pages-deploy
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy Pages (attempt 1)
        id: deployment
        uses: actions/deploy-pages@v5
